<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>イナイレ協力クイズ | Prototype</title><style>
:root{font-family:system-ui,'Yu Gothic',sans-serif;color:#f5f8ff;background:#08172f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% 0,#184a83 0,transparent 50%),linear-gradient(145deg,#071328,#112e58)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:#254e83;color:white;font-weight:800}button:hover:not(:disabled){filter:brightness(1.15)}button:disabled{opacity:.45;cursor:not-allowed}.gold{background:linear-gradient(135deg,#ffdf62,#e9a91b);color:#172743}.danger{background:#9d3551}.ghost{background:#203f6a}.wrap{max-width:1000px;margin:auto;padding:24px 16px 110px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:clamp(24px,5vw,38px);margin:0;color:#ffdc65;text-shadow:0 0 20px #ffcb4855}h2{margin:0 0 14px;font-size:23px}h3{margin:8px 0}.sub{color:#bbd4ef;font-size:13px}.panel{background:#102b50d9;border:1px solid #37659c;border-radius:20px;padding:20px;margin-top:18px;box-shadow:0 12px 35px #0003}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.stack{display:grid;gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}label{display:grid;gap:5px;font-size:13px;color:#c9def6}input,select,textarea{width:100%;background:#081e3b;color:#fff;border:1px solid #4572a5;border-radius:10px;padding:11px}textarea{min-height:80px;resize:vertical}input[type=checkbox]{width:auto}.muted{color:#aac9e7}.pill{display:inline-block;background:#224b7b;border:1px solid #4974a7;border-radius:100px;padding:5px 11px;font-size:12px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.answer{min-height:70px;text-align:left;font-size:17px;border:2px solid #4675aa;background:linear-gradient(140deg,#1c477d,#15335c)}.answer.selected{border-color:#ffda58;background:#7d5d1e;box-shadow:0 0 20px #ffd14c77}.answer.correct{border-color:#73ebae}.answer.wrong{border-color:#e47b91}.timer{font-size:27px;font-weight:900;color:#ffdf62}.progress{height:12px;border-radius:99px;background:#071a33;overflow:hidden}.progress>div{height:100%;background:#ffcb3b;transition:width .2s}.big{font-size:clamp(28px,6vw,56px);font-weight:1000;color:#ffdd5b;text-align:center}.center{text-align:center}.hidden{display:none!important}.reactbar{position:fixed;bottom:0;left:0;right:0;background:#081a33ed;border-top:1px solid #4a77a4;padding:10px;z-index:20;display:flex;justify-content:center;gap:8px}.reactbar button{font-size:24px;padding:7px 13px}.float-layer{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}.float{position:absolute;bottom:85px;left:var(--x);display:grid;text-align:center;font-size:31px;animation:fly 3s ease-out forwards;text-shadow:0 2px 6px #000}.float small{font-size:11px;color:#fff}@keyframes fly{to{transform:translateY(-200px);opacity:0}}.flash{animation:flash .5s 3}@keyframes flash{50%{filter:brightness(2)}}.countdown{font-size:50px;color:#ffdf62;font-weight:1000}.notice{border-left:4px solid #ffda5d;padding:9px 12px;background:#1b3c66;border-radius:5px}.tiny{font-size:12px}.questions-list{max-height:270px;overflow:auto}.qrow{border-bottom:1px solid #375a83;padding:10px 0}.badge{color:#ffdf62;font-weight:800}#toast{position:fixed;top:15px;right:15px;background:#f5c84a;color:#14233d;padding:13px 20px;border-radius:12px;font-weight:800;z-index:60;max-width:90vw;display:none}#overlay{position:fixed;inset:0;background:#061126ed;display:none;z-index:40;align-items:center;justify-content:center;padding:20px}#overlay>div{max-width:600px;width:100%;border:2px solid #e5b63d;background:radial-gradient(circle,#295894,#10264a);padding:30px;border-radius:25px;text-align:center;box-shadow:0 0 100px #ffcc3970}.lightning{font-size:80px;animation:pulse .7s infinite alternate}@keyframes pulse{to{transform:scale(1.25);filter:drop-shadow(0 0 25px gold)}}@media(max-width:620px){.grid,.choices{grid-template-columns:1fr}.panel{padding:15px}.wrap{padding-top:14px}.reactbar button{padding:8px}}
.confirm-backdrop{position:fixed;inset:0;z-index:55;background:#051021e8;display:flex;align-items:center;justify-content:center;padding:18px}.confirm-panel{background:#15365f;border:2px solid #f4c94c;border-radius:20px;padding:24px;max-width:420px;width:100%;text-align:center;box-shadow:0 15px 50px #0009}.confirm-panel p{overflow-wrap:anywhere}.confirm-backdrop.hidden{display:none!important}.answer:focus-visible,button:focus-visible{outline:3px solid #ffda58;outline-offset:3px}</style></head><body><div id="toast"></div><div id="overlay"><div><div class="lightning">⚡</div><div id="overlayText" class="big">TEAM CLEAR!</div><p id="overlaySub"></p><button onclick="skipAnimation()">スキップ</button></div></div><div id="answerDialog" class="confirm-backdrop hidden"><div class="confirm-panel"><h2>⚡ 回答を確定する？</h2><p id="answerPreview"></p><p class="muted">確定後は変更できません。</p><div class="row" style="justify-content:center"><button onclick="cancelAnswerConfirm()">戻る</button><button class="gold" onclick="submitAnswerConfirmed()">確定する</button></div></div></div><div class="float-layer" id="floats"></div><main class="wrap"><header><div><h1>⚡ イナイレ協力クイズ</h1><div class="sub">KICK OFF! | プレイヤー版 v0.4（問題は運営者が管理）</div></div><div class="row"><span id="roomBadge" class="pill">ローカル体験版</span><button class="ghost" onclick="toggleMute()" id="muteBtn">🔊 音 ON</button></div></header><div id="app"></div></main><div class="reactbar hidden" id="reactbar"><button onclick="reaction('⚡')">⚡</button><button onclick="reaction('🔥')">🔥</button><button onclick="reaction('👏')">👏</button><button onclick="reaction('😱')">😱</button><button onclick="reaction('💪')">💪</button></div><script>
'use strict';const SAMPLE=[{id:'q1',type:'choice',difficulty:'初級',question:'雷門中サッカー部のキャプテンは誰？',choices:['円堂守','豪炎寺修也','鬼道有人','風丸一郎太'],answers:['円堂守'],threshold:60},{id:'q2',type:'choice',difficulty:'初級',question:'豪炎寺修也が得意とするポジションは？',choices:['GK','FW','DF','MF'],answers:['FW'],threshold:60},{id:'q3',type:'choice',difficulty:'中級',question:'円堂守の代表的なキーパー技は？',choices:['ファイアトルネード','ゴッドハンド','イナズマブレイク','エターナルブリザード'],answers:['ゴッドハンド'],threshold:70},{id:'q4',type:'text',difficulty:'中級',question:'「エターナルブリザード」を使う選手の名前は？（フルネーム）',choices:[],answers:['吹雪士郎'],threshold:70},{id:'q5',type:'choice',difficulty:'上級',question:'鬼道有人が主に務めるポジションは？',choices:['GK','DF','MF','FW'],answers:['MF'],threshold:75}];
const S={screen:'home',room:'',nickname:'',icon:'⚽',host:true,questions:JSON.parse(JSON.stringify(SAMPLE)),pool:[],used:[],players:[],settings:{mode:'record',difficulty:'すべて',limit:0,threshold:60,count:5},index:0,current:null,choice:null,submitted:false,closed:false,startedAt:0,deadline:0,remaining:0,paused:false,stats:[],reactionsAt:0,mute:false,animation:null,phase:'idle'};const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rand=n=>Math.floor(Math.random()*n);const shuffle=a=>[...a].sort(()=>Math.random()-.5);function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',2600)}function beep(freq=540,dur=.1){if(S.mute)return;try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.type='triangle';g.gain.value=.035;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur);o.onended=()=>a.close()}catch(e){}}function toggleMute(){S.mute=!S.mute;$('muteBtn').textContent=S.mute?'🔇 音 OFF':'🔊 音 ON'}function normalize(s){return String(s??'').normalize('NFKC').replace(/\s/g,'').replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96)).toLowerCase()}function valid(q,a){return q.answers.some(v=>normalize(v)===normalize(a))}function roomCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function render(){let html='';$('roomBadge').textContent=S.room?'ROOM '+S.room:'ローカル体験版';$('reactbar').classList.toggle('hidden',!(S.screen==='wait'||S.screen==='result'||S.screen==='end'));if(S.screen==='home')html=`<section class="panel center"><div class="big">KICK OFF!</div><p>協力して必要正解率を突破しよう！</p><p class="notice">この版は1台のブラウザで遊ぶデモです。ルームコードは表示されますが、他の端末との接続はまだできません。</p><div class="grid"><label>ニックネーム<input id="name" maxlength="12" placeholder="例：円堂" value="${esc(S.nickname)}"></label><label>アイコン<select id="icon"><option>⚽</option><option>⚡</option><option>🔥</option><option>🧤</option><option>🌪️</option><option>❄️</option><option value="🥽">🥽</option><option value="🌰">🌰</option><option value="🗼">🗼</option><option value="🧱">🧱</option></select></label></div><p><button class="gold" onclick="createRoom()">⚡ 部屋を作る</button></p></section><section class="panel"><h3>今回できること</h3><p class="muted">運営者が用意した問題への回答、成功判定、結果発表、リアクション、成績のCSV保存。テスト用の仮想参加者を追加できます。</p></section>`;
if(S.screen==='lobby')html=`<section class="panel"><div class="row spread"><h2>🏟️ ルーム ${esc(S.room)}</h2><span class="pill">ホスト：${esc(S.icon+' '+S.nickname)}</span></div><p class="notice">オンライン参加は未実装。仮想参加者でチーム判定を試せます。</p><div class="grid"><label>ゲームモード<select id="mode"><option value="record" ${S.settings.mode==='record'?'selected':''}>失敗を記録して次へ</option><option value="retry" ${S.settings.mode==='retry'?'selected':''}>成功するまで再挑戦</option><option value="survival" ${S.settings.mode==='survival'?'selected':''}>サバイバル（失敗で終了）</option></select></label><label>難易度<select id="difficulty">${['すべて','初級','中級','上級','鬼','神'].map(x=>`<option ${S.settings.difficulty===x?'selected':''}>${x}</option>`).join('')}</select></label><label>制限時間（秒・0で無制限／初期設定は無制限）<input id="limit" type="number" min="0" max="600" value="${S.settings.limit}"></label><label>出題数<select id="count">${[5,10,20,50,9999].map(x=>`<option value="${x}" ${S.settings.count===x?'selected':''}>${x===9999?'全問':x+'問'}</option>`).join('')}</select></label><label>仮想参加者数（ホストを除く）<input id="bots" type="number" min="0" max="49" value="${Math.max(0,S.players.length-1)}"></label></div><p class="row"><button class="gold" onclick="startGame()">⚡ ゲーム開始</button><button class="ghost" onclick="S.screen='home';S.room='';render()">退出</button></p></section><section class="panel"><h3>参加者プレビュー</h3><p>${esc(S.icon+' '+S.nickname)}（ホスト） ${S.players.slice(1).map(p=>esc('・'+p.icon+' '+p.name)).join(' ')}</p></section>`;
if(S.screen==='question'||S.screen==='wait')html=`<section class="panel"><div class="row spread"><span class="pill">QUESTION ${S.index+1} / ${S.pool.length}</span><span class="pill">${esc(S.current.difficulty)}</span><span class="pill">必要正答率 ${esc(S.current.threshold)}%</span><span class="timer" id="timer">${S.settings.limit?Math.ceil(S.remaining)+'秒':'∞'}</span></div><div class="progress" style="margin:14px 0"><div id="timebar" style="width:${S.settings.limit ? Math.max(0,Math.min(100,S.remaining/S.settings.limit*100)) : 100}%"></div></div><h2 class="center" style="margin:35px 0">${esc(S.current.question)}</h2>${S.current.type==='choice'?`<div class="choices">${S.current.order.map((x,i)=>`<button class="answer ${S.choice===x?'selected':''}" ${S.submitted||S.closed?'disabled':''} onclick="pick(${JSON.stringify(x).replace(/"/g,'&quot;')})">${'ABCD'[i]}. ${esc(x)}</button>`).join('')}</div>`:`<label>答えを入力（100文字以内）<textarea id="textAnswer" maxlength="100" ${S.submitted||S.closed?'disabled':''} oninput="$('charcount').textContent=this.value.length+'/100'">${esc(S.choice||'')}</textarea><span id="charcount" class="tiny">${(S.choice||'').length}/100</span></label>`}<p class="row"><button class="gold" ${S.submitted||S.closed?'disabled':''} onclick="confirmAnswer()">${S.submitted?'回答確定済み':'⚡ 回答を確定'}</button><button onclick="closeQuestion()">ホスト：回答を締切</button><button class="ghost" onclick="togglePause()">${S.paused?'▶ 再開':'⏸ 一時停止'}</button></p><div class="notice"><b>${S.submitted?'あなたの回答は確定済み':'回答受付中'}</b><p class="tiny">チーム回答状況：<span id="answeredCount">${S.players.filter(p=>p.answered).length}</span> / ${S.players.length}人（仮想参加者は締切時に回答）</p><div class="progress"><div id="answerbar" style="width:${100*S.players.filter(p=>p.answered).length/S.players.length}%"></div></div></div></section>`;
if(S.screen==='result'){let r=S.stats[S.stats.length-1];html=`<section class="panel center"><span class="pill">QUESTION ${S.index+1}</span><div class="big">${r.success?'TEAM CLEAR!':'TEAM FAILED'}</div>${r.success||S.settings.mode!=='retry'?`<h2>正解：${esc(S.current.answers.join(' / '))}</h2><p>あなた：${r.personalCorrect?'⭕ 正解':r.myAnswer?'❌ 不正解':'未回答'}</p>`:'<h2>再挑戦！ 正解はまだ秘密</h2>'}<h3>チーム正解 ${r.correct} / ${r.total}人（${Math.round(r.correct/r.total*100)}%）</h3><p class="muted">必要正解率 ${r.threshold}% ／ 必要人数 ${r.required}人</p><p class="row" style="justify-content:center"><button class="gold" onclick="nextQuestion()">${!r.success&&S.settings.mode==='retry'?'🔄 再挑戦':S.index+1>=S.pool.length||(!r.success&&S.settings.mode==='survival')?'🏆 最終結果へ':'⚡ 次の問題へ'}</button><button onclick="endGame()">ゲームを終了</button></p><div class="notice">リアクションを送ってチームを盛り上げよう！</div></section>`}
if(S.screen==='end'){const done=S.stats.filter(x=>x.success||S.settings.mode!=='retry');const won=done.filter(x=>x.success).length;html=`<section class="panel center"><div class="big">🏆 FINAL RESULT</div><h2>チーム成功：${won} / ${done.length}問</h2><h3>成功率 ${done.length?Math.round(won/done.length*100):0}%</h3><p class="muted">${esc(S.nickname)}：${S.stats.filter(x=>x.personalCorrect).length}問正解</p><p class="row" style="justify-content:center"><button class="gold" onclick="rematch()">⚡ 同じ部屋でもう一度</button><button onclick="downloadResults()">📥 結果CSV</button><button onclick="shareX()">𝕏 共有</button></p></section><section class="panel"><h3>問題別結果</h3>${S.stats.map((r,i)=>`<div class="qrow">${i+1}. ${esc(r.question)} — ${r.success?'⭕ 成功':'❌ 失敗'}（${r.correct}/${r.total}）</div>`).join('')}</section>`}
$('app').innerHTML=html;if(S.screen==='home')$('icon').value=S.icon}
function createRoom(){let n=$('name').value.trim();if(!n||n.length>12)return toast('ニックネームは1〜12文字で入力してね');S.nickname=n;S.icon=$('icon').value;S.room=roomCode();S.players=[{name:n,icon:S.icon,answered:false,answer:null}];S.screen='lobby';render()}
function saveSettings(){S.settings.mode=$('mode').value;S.settings.difficulty=$('difficulty').value;S.settings.limit=Math.max(0,Math.min(600,Number($('limit').value)||0));S.settings.count=Number($('count').value);const n=Math.max(0,Math.min(49,Number($('bots').value)||0));S.players=[{name:S.nickname,icon:S.icon,answered:false,answer:null},...Array.from({length:n},(_,i)=>({name:'ゲスト'+(i+1),icon:['⚡','🔥','❄️','⚽','🌪️'][i%5],answered:false,answer:null}))]}
function startGame(){saveSettings();let pool=S.questions.filter(q=>S.settings.difficulty==='すべて'||q.difficulty===S.settings.difficulty);if(!pool.length)return toast('この難易度の問題がありません');S.pool=shuffle(pool).slice(0,S.settings.count);S.index=0;S.stats=[];S.used=[];launchQuestion()}
function launchQuestion(){S.current=S.pool[S.index];S.current.order=S.current.type==='choice'?shuffle(S.current.choices):[];S.choice=null;S.submitted=false;S.closed=false;S.paused=false;S.remaining=S.settings.limit;S.deadline=Date.now()+S.settings.limit*1000;S.players.forEach(p=>{p.answered=false;p.answer=null});S.screen='question';render()}
function pick(x){if(S.submitted||S.closed)return;S.choice=x;render()}
let pendingAnswer=null;
function confirmAnswer(){
 if(S.submitted||S.closed)return toast('この問題の回答受付は終了しています');
 let a=S.current.type==='text'?$('textAnswer').value.trim():S.choice;
 if(!a)return toast('先に選択肢を選ぶか、回答を入力してね');
 if(S.settings.limit&&S.remaining<=0)return toast('回答時間が終了しました');
 pendingAnswer=a;
 $('answerPreview').textContent='あなたの回答：'+a;
 $('answerDialog').classList.remove('hidden');
}
function cancelAnswerConfirm(){pendingAnswer=null;$('answerDialog').classList.add('hidden')}
function submitAnswerConfirmed(){
 if(pendingAnswer===null)return;
 if(S.submitted||S.closed||(S.settings.limit&&S.remaining<=0)){cancelAnswerConfirm();return toast('回答受付が終了しました')}
 S.choice=pendingAnswer;cancelAnswerConfirm();S.submitted=true;
 S.players[0].answered=true;S.players[0].answer=S.choice;
 S.screen='wait';beep(700,.12);render();if(S.players.length===1)closeQuestion();
}
function togglePause(){if(S.closed)return;S.paused=!S.paused;if(!S.paused)S.deadline=Date.now()+S.remaining*1000;render()}
function closeQuestion(){if(S.closed)return;cancelAnswerConfirm();S.closed=true;let q=S.current;S.players.slice(1).forEach(p=>{p.answered=true;p.answer=Math.random()<.68?q.answers[0]:q.type==='choice'?q.choices.filter(c=>!valid(q,c))[rand(3)]:'わからない'});let correct=S.players.filter(p=>valid(q,p.answer)).length,total=S.players.length,threshold=q.threshold,required=Math.ceil(total*threshold/100),success=correct>=required;S.stats.push({id:q.id,question:q.question,correct,total,threshold,required,success,myAnswer:S.players[0].answer||'',personalCorrect:valid(q,S.players[0].answer)});S.screen='result';render();showAnimation(success)}
function showAnimation(success){$('overlay').style.display='flex';$('overlayText').textContent=success?'TEAM CLEAR!':'TEAM FAILED';$('overlaySub').textContent=success?'必殺技発動！ チームの力で突破！':'必殺技不発！ まだ終わらない！';$('overlayText').style.color=success?'#ffdf62':'#d7bdff';beep(success?800:240,.25);clearTimeout(S.animation);S.animation=setTimeout(skipAnimation,4000)}function skipAnimation(){$('overlay').style.display='none';clearTimeout(S.animation)}
function nextQuestion(){let r=S.stats[S.stats.length-1];if(!r.success&&S.settings.mode==='retry'){S.stats.pop();launchQuestion();return}if(!r.success&&S.settings.mode==='survival'||S.index+1>=S.pool.length){endGame();return}S.index++;launchQuestion()}
function endGame(){skipAnimation();S.screen='end';render()}function rematch(){S.screen='lobby';render()}
function reaction(e){if(Date.now()-S.reactionsAt<3000)return toast('リアクションは3秒に1回まで');S.reactionsAt=Date.now();const layer=$('floats');if(layer.children.length>=5)layer.firstElementChild.remove();const el=document.createElement('div');el.className='float';el.style.setProperty('--x',(15+rand(65))+'%');el.innerHTML=esc(e)+'<small>'+esc(S.nickname)+'</small>';layer.appendChild(el);setTimeout(()=>el.remove(),3000);beep(500,.05)}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function csvRows(rows){return '\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')}function download(name,content){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function downloadResults(){download('inazuma_results.csv',csvRows([['question','correct','total','required','success','myAnswer','personalCorrect'],...S.stats.map(r=>[r.question,r.correct,r.total,r.required,r.success,r.myAnswer,r.personalCorrect])]))}
function parseCSV(s){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<s.length;i++){const c=s[i];if(quoted){if(c==='"'&&s[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field=''}else field+=c}if(field||row.length){row.push(field);rows.push(row)}return rows}
function shareX(){let won=S.stats.filter(x=>x.success).length,total=S.stats.length;let msg=`イナイレ協力クイズに挑戦！⚡\nチーム成功 ${won}/${total}問！\n#イナイレクイズ`;window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(msg),'_blank','noopener')}
setInterval(()=>{if((S.screen!=='question'&&S.screen!=='wait')||S.closed||S.paused||!S.settings.limit)return;S.remaining=Math.max(0,(S.deadline-Date.now())/1000);let t=$('timer'),b=$('timebar');if(t)t.textContent=Math.ceil(S.remaining)+'秒';if(b)b.style.width=(S.remaining/S.settings.limit*100)+'%';if(S.remaining<=0)closeQuestion()},120);render();
</script></body></html>
