const SAMPLE=[{id:'q1',type:'choice',difficulty:'初級',question:'雷門中サッカー部のキャプテンは誰？',choices:['円堂守','豪炎寺修也','鬼道有人','風丸一郎太'],answers:['円堂守'],threshold:60},{id:'q2',type:'choice',difficulty:'初級',question:'豪炎寺修也が得意とするポジションは？',choices:['GK','FW','DF','MF'],answers:['FW'],threshold:60},{id:'q3',type:'choice',difficulty:'中級',question:'円堂守の代表的なキーパー技は？',choices:['ファイアトルネード','ゴッドハンド','イナズマブレイク','エターナルブリザード'],answers:['ゴッドハンド'],threshold:70},{id:'q4',type:'text',difficulty:'中級',question:'「エターナルブリザード」を使う選手の名前は？（フルネーム）',choices:[],answers:['吹雪士郎'],threshold:70},{id:'q5',type:'choice',difficulty:'上級',question:'鬼道有人が主に務めるポジションは？',choices:['GK','DF','MF','FW'],answers:['MF'],threshold:75}];
// 問題はホスト端末に保存。参加者には問題文のみ共有し、正解は送信しません。
let questionBank=loadQuestionBank();
function loadQuestionBank(){try{const v=JSON.parse(localStorage.getItem('inazuma_question_bank_v08')||'null');return Array.isArray(v)&&v.length?v:SAMPLE.slice()}catch(e){return SAMPLE.slice()}}
function validateBank(v){
 if(!Array.isArray(v)||!v.length||v.length>5000)throw Error('問題は1〜5000件にしてください');
 const ids=new Set();
 for(const q of v){
  if(!q||typeof q.id!=='string'||!q.id.trim()||ids.has(q.id))throw Error('問題IDが空欄か重複しています');ids.add(q.id);
  if(!['choice','text'].includes(q.type)||typeof q.question!=='string'||!q.question.trim()||!Array.isArray(q.answers)||!q.answers.length||q.answers.some(a=>typeof a!=='string'||!a.trim()))throw Error('問題形式・問題文・正解を確認してください: '+q.id);
  if(q.type==='choice'&&(!Array.isArray(q.choices)||q.choices.length!==4||q.choices.some(c=>typeof c!=='string'||!c.trim())||!q.answers.every(a=>q.choices.includes(a))))throw Error('4択は選択肢4個と一致する正解が必要です: '+q.id);
  if(!Number.isFinite(Number(q.threshold))||Number(q.threshold)<1||Number(q.threshold)>100)throw Error('成功ラインは1〜100%にしてください: '+q.id);
 }
 return v;
}
async function importQuestionBank(input){
 if(!isHost||roomData?.status!=='lobby')return toast('ホストがロビーで読み込んでください');
 const f=input.files?.[0];if(!f)return;
 try{const v=validateBank(JSON.parse(await f.text()));localStorage.setItem('inazuma_question_bank_v08',JSON.stringify(v));questionBank=v;toast('問題データ '+v.length+'問を読み込みました');render()}
 catch(e){error(e)}finally{input.value=''}
}
function resetQuestionBank(){if(!isHost||!confirm('テスト問題5問に戻しますか？'))return;localStorage.removeItem('inazuma_question_bank_v08');questionBank=SAMPLE.slice();render()}
function previewMode(sel){const label=MODE_LABEL[sel.value]||MODE_LABEL.record;const el=document.getElementById('modePreview');if(el)el.textContent='選択中：'+label;const badge=document.getElementById('modeBadge');if(badge)badge.textContent=label+' ・ 👑 ホスト・'+Object.keys(roomData?.players||{}).length+'/50人'}
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.database(),$=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MODE_LABEL={record:'🏆 記録モード',retry:'🔁 リトライモード',survival:'🔥 サバイバルモード'};
const icons=['⚽','⚡','🔥','🧤','🌪️','❄️','🥽','🌰','🗼','🧱'];
let pendingJoinId='',joinWatch=null,joinBusy=false;let muted=false,animationTimer=null,lastResultKey='',reactionAt=0,pendingAnswer=null;let uid='',room='',isHost=false,profile={name:'',icon:'⚽'},roomData=null,roomListener=null,busy=false,localAnswer='',activeRound='',tick=null,processing=false,autoCloseTimer=null;
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',4500)}
function error(e){console.error(e);toast('エラー：'+(e?.message||e))}
function code(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=new Uint32Array(6);crypto.getRandomValues(b);return Array.from(b,x=>a[x%a.length]).join('')}
function normalize(s){return String(s||'').normalize('NFKC').replace(/[\s　]/g,'').replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96)).toLowerCase()}
function home(){skipAnimation();$('reactbar').classList.add('hidden');room='';roomData=null;$('roomBadge').textContent='未参加';let join=(new URLSearchParams(location.search).get('room')||'').toUpperCase().slice(0,6);$('app').innerHTML=`<section class="panel"><h2>🏟️ オンライン協力クイズ</h2><p class="notice">全員が回答すると自動で判定します。以前の青×金のデザインを引き継いだオンラインテスト版です。ホストは問題データJSONを読み込めます。初期状態はテスト用の5問です。参加にはホストの承認が必要です。</p><div class="grid"><label>ニックネーム<input id="name" maxlength="12" value="${esc(profile.name)}" placeholder="例：円堂"></label><label>アイコン<select id="icon">${icons.map(i=>`<option ${i===profile.icon?'selected':''}>${i}</option>`).join('')}</select></label></div><p><button class="gold" onclick="createRoom()">⚡ 部屋を作る（ホスト）</button></p><div class="divider"></div><h3>友達の部屋に参加</h3><label>部屋番号<input id="joinCode" maxlength="6" value="${esc(join)}" placeholder="6文字"></label><p><button onclick="joinRoom()">部屋に参加する</button></p></section>`}
function readProfile(){let name=$('name')?.value.trim();if(!name||name.length>12){toast('ニックネームを1〜12文字で入力してね');return false}profile={name,icon:$('icon').value};return true}
async function createRoom(){if(busy||!uid||!readProfile())return;busy=true;try{let id,ref,ok=false;for(let n=0;n<8;n++){id=code();ref=db.ref('rooms/'+id);let r=await ref.transaction(v=>v===null?{hostUid:uid,createdAt:firebase.database.ServerValue.TIMESTAMP,status:'lobby',round:0,questionIndex:0,settings:{mode:'record',difficulty:'すべて',count:5,seconds:60},autoApprove:false,players:{[uid]:{name:profile.name,icon:profile.icon,joinedAt:firebase.database.ServerValue.TIMESTAMP}}}:undefined,undefined,false);if(r.committed){ok=true;break}}if(!ok)throw Error('部屋を作れませんでした');enter(id)}catch(e){error(e)}finally{busy=false}}
async function joinRoom(){
 if(busy||!uid||!readProfile())return;
 const id=$('joinCode').value.trim().toUpperCase();
 if(!/^[A-Z2-9]{6}$/.test(id))return toast('6文字の部屋番号を入力してね');
 busy=true;
 try{
  const ref=db.ref('rooms/'+id),snap=await ref.once('value');
  if(!snap.exists())throw Error('部屋が見つかりません');
  const d=snap.val();
  if(d.bans?.[uid])throw Error('この部屋への参加が制限されています');
  if(d.players?.[uid]){enter(id);return}
  const existing=Object.entries(d.players||{});
  if(existing.some(([k,v])=>k!==uid&&v.name===profile.name))throw Error('同じニックネームが使われています');
  const already=d.requests?.[uid];
  if(!already){
   await ref.child('requests/'+uid).set({name:profile.name,icon:profile.icon,requestedAt:firebase.database.ServerValue.TIMESTAMP,status:'pending'});
  }
  watchJoin(id);
 }catch(e){error(e)}finally{busy=false}
}
function stopJoinWatch(){if(joinWatch){db.ref('rooms/'+joinWatch.id).off('value',joinWatch.cb);joinWatch=null}pendingJoinId=''}
function watchJoin(id){
 stopJoinWatch();pendingJoinId=id;
 const cb=s=>{
  if(pendingJoinId!==id)return;
  if(!s.exists()){stopJoinWatch();home();toast('部屋が終了しました');return}
  const d=s.val();
  if(d.players?.[uid]){stopJoinWatch();enter(id);return}
  if(d.bans?.[uid]){stopJoinWatch();home();toast('この部屋への参加が制限されました');return}
  const req=d.requests?.[uid];
  if(!req||req.status==='rejected'){stopJoinWatch();home();toast('参加申請が承認されませんでした');return}
  const queue=Object.entries(d.requests||{}).filter(([k,v])=>v.status==='pending').sort((a,b)=>(a[1].requestedAt||0)-(b[1].requestedAt||0));
  const pos=queue.findIndex(([k])=>k===uid)+1;
  $('app').innerHTML=`<section class="panel center"><h2>⏳ 参加承認待ち</h2><p>ルーム ${esc(id)} のホストによる承認を待っています。</p><p class="notice">${Object.keys(d.players||{}).length>=50?'満員のため順番待ち中':'参加申請中'} ・ 待機順 ${pos||'-'}番</p><p class="muted">ホストが承認すると自動で入室します。</p><button onclick="cancelJoin()">申請を取り消す</button></section>`;
 };
 joinWatch={id,cb};db.ref('rooms/'+id).on('value',cb,error);
}
async function cancelJoin(){const id=pendingJoinId;if(!id||!confirm('参加申請を取り消しますか？'))return;try{await db.ref('rooms/'+id+'/requests/'+uid).remove();stopJoinWatch();home()}catch(e){error(e)}}
async function setAutoApprove(value){if(!isHost)return;try{await db.ref('rooms/'+room+'/autoApprove').set(!!value)}catch(e){error(e)}}
async function approveJoin(id){
 if(!isHost||joinBusy||!roomData||roomData.status!=='lobby')return;
 joinBusy=true;
 try{
  const ref=db.ref('rooms/'+room);
  const result=await ref.transaction(d=>{
   if(!d||d.status!=='lobby'||d.bans?.[id]||d.players?.[id]||!d.requests?.[id]||d.requests[id].status!=='pending')return;
   if(Object.keys(d.players||{}).length>=50)return;
   if(Object.values(d.players||{}).some(p=>p.name===d.requests[id].name))return;
   d.players=d.players||{};d.players[id]={name:d.requests[id].name,icon:d.requests[id].icon,joinedAt:Date.now()};
   delete d.requests[id];return d;
  },undefined,false);
  if(!result.committed)toast('承認できませんでした（満員・重複名・申請状態を確認）');
 }catch(e){error(e)}finally{joinBusy=false}
}
async function rejectJoin(id){if(!isHost||!confirm('この参加申請を拒否しますか？'))return;try{await db.ref('rooms/'+room+'/requests/'+id).remove()}catch(e){error(e)}}
async function banPlayer(id){
 if(!isHost||id===uid)return;
 const d=roomData,p=d.players?.[id]||d.requests?.[id];if(!p)return;
 if(!confirm(esc(p.name)+' をBANして部屋から退出させますか？'))return;
 const reason=prompt('BAN理由（空欄でもOK）','');if(reason===null)return;
 try{await db.ref('rooms/'+room).update({['bans/'+id]:{name:p.name,reason:reason.slice(0,150),at:firebase.database.ServerValue.TIMESTAMP},['players/'+id]:null,['requests/'+id]:null})}catch(e){error(e)}
}
async function unbanPlayer(id){if(!isHost||!confirm('BANを解除しますか？'))return;try{await db.ref('rooms/'+room+'/bans/'+id).remove()}catch(e){error(e)}}
function joinManagement(d){
 const queue=Object.entries(d.requests||{}).filter(([k,v])=>v.status==='pending').sort((a,b)=>(a[1].requestedAt||0)-(b[1].requestedAt||0));
 const banned=Object.entries(d.bans||{});
 return `<section class="panel"><h2>🛡️ ホストの参加管理</h2><label class="row"><input type="checkbox" ${d.autoApprove?'checked':''} onchange="setAutoApprove(this.checked)">自動承認を有効にする（空きがあるとき先頭から承認）</label><p class="muted">承認待ち ${queue.length}人 / 現在 ${Object.keys(d.players||{}).length}人</p>${queue.length?queue.map(([id,r],i)=>`<div class="qrow"><div><strong>${i+1}番 ${esc(r.icon||'⚽')} ${esc(r.name)}</strong> ${Object.keys(d.players||{}).length>=50?'（満員）':''}</div><div class="row"><button ${d.status!=='lobby'||Object.keys(d.players||{}).length>=50?'disabled':''} onclick="approveJoin('${esc(id)}')">承認</button><button onclick="rejectJoin('${esc(id)}')">拒否</button><button class="danger" onclick="banPlayer('${esc(id)}')">BAN</button></div></div>`).join(''):'<p class="muted">現在、参加申請はありません。</p>'}<h3>BAN一覧</h3>${banned.length?banned.map(([id,b])=>`<div class="qrow row spread"><span>${esc(b.name||'ゲスト')} ${b.reason?'・'+esc(b.reason):''}</span><button onclick="unbanPlayer('${esc(id)}')">BAN解除</button></div>`).join(''):'<p class="muted">BANされた参加者はいません。</p>'}</section>`;
}
async function maybeAutoApprove(){
 const d=roomData;if(!isHost||!d?.autoApprove||d.status!=='lobby'||joinBusy)return;

// v1.1: 明示的に共有した結果だけをFirebaseへ公開する。
function shareLink(id){return location.origin+location.pathname+'?result='+encodeURIComponent(id)}
async function publishSavedResult(x){
 if(!isHost||!uid)throw Error('ホストとして部屋に参加している必要があります');
 if(x.room!==room)throw Error('この結果を共有するには、記録した部屋にホストとして参加してください。部屋を終了している場合は共有できません');
 const id='r'+x.savedAt.toString(36)+'_'+uid.slice(0,8)+'_'+Math.random().toString(36).slice(2,12);
 const data={room:x.room,hostUid:uid,savedAt:x.savedAt,mode:x.mode,wins:x.wins,attempts:x.attempts,players:x.players.map(p=>({name:String(p.name).slice(0,12),icon:String(p.icon).slice(0,8),correct:p.correct||0,answered:p.answered||0}))};
 await db.ref('sharedResults/'+id).set(data);
 return shareLink(id);
}
async function ensureShareUrl(x){
 if(x.shareUrl)return x.shareUrl;
 const url=await publishSavedResult(x);
 const items=getSavedResults(),target=items.find(v=>v.id===x.id);
 if(target){target.shareUrl=url;localStorage.setItem(RESULT_STORAGE_KEY,JSON.stringify(items))}
 return url;
}

 try{const url=await ensureShareUrl(x);try{await navigator.clipboard.writeText(url);toast('🔗 結果URLをコピーしました')}catch(e){prompt('このURLをコピーしてください',url)}}catch(e){error(e)}

 try{

 c.fillStyle='#ffda57';c.font='bold 36px sans-serif';c.fillText('🏆 個人ランキング',60,427);

 canvas.toBlob(blob=>blob?resolve(blob):reject(Error('画像を作成できません')),'image/png');

let audioCtx=null;
function tone(f,when,duration,shape='sine',volume=.07,endFreq=null){
 if(muted)return;
 try{
  audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+when;
  o.type=shape;o.frequency.setValueAtTime(f,t);
  if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,t+duration);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+duration);
  o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.02);
 }catch(e){}
}
function playSound(kind){
 if(kind==='reaction'){tone(950,0,.075,'sine',.055,1250);tone(1500,.07,.105,'sine',.045,1750)}
 if(kind==='correct'){tone(523.25,0,.16,'triangle',.075);tone(659.25,.13,.17,'triangle',.08);tone(783.99,.27,.18,'triangle',.085);tone(1046.5,.43,.36,'sine',.09);tone(1567.98,.48,.26,'sine',.025)}
 if(kind==='wrong'){tone(392,0,.24,'triangle',.065,330);tone(311,.21,.28,'triangle',.07,245);tone(196,.48,.44,'sine',.075,130)}
}

let reactionListener=null,reactionRoom='',reactionSeen=new Set();
function detachReactions(){
 if(reactionListener&&reactionRoom)db.ref('rooms/'+reactionRoom+'/reactions').off('child_added',reactionListener);
 reactionListener=null;reactionRoom='';reactionSeen.clear();
}
function attachReactions(id){
 detachReactions();reactionRoom=id;
 const ref=db.ref('rooms/'+id+'/reactions');
 // Ignore reactions already stored before this client joined.
 ref.once('value').then(snapshot=>{
  if(room!==id)return;
  snapshot.forEach(child=>reactionSeen.add(child.key));
  reactionListener=snap=>{
   if(reactionSeen.has(snap.key)||room!==id)return;
   reactionSeen.add(snap.key);
   const r=snap.val();
   if(!r||!['⚡','🔥','👏','😱','💪'].includes(r.emoji))return;
   showReaction(r.emoji,r.name||'ゲスト',true);
  };
  ref.on('child_added',reactionListener,error);
 }).catch(error);
}
function showReaction(emoji,name,withSound){
 const layer=$('floats');if(layer.children.length>=5)layer.firstElementChild.remove();
 const el=document.createElement('div');el.className='float';
 el.style.setProperty('--x',(15+Math.floor(Math.random()*65))+'%');
 el.innerHTML=esc(emoji)+'<small>'+esc(name)+'</small>';
 layer.appendChild(el);setTimeout(()=>el.remove(),3000);
 if(withSound)playSound('reaction');
}
async function reaction(emoji){
 if(!room||!roomData)return;
 if(Date.now()-reactionAt<3000)return toast('リアクションは3秒に1回まで');
 reactionAt=Date.now();
 // Show instantly on sender's device; ignore own Firebase echo.
 showReaction(emoji,profile.name,true);
 try{
  const ref=db.ref('rooms/'+room+'/reactions').push();
  reactionSeen.add(ref.key);
  await ref.set({emoji,name:profile.name,uid,at:firebase.database.ServerValue.TIMESTAMP});
 }catch(e){error(e)}
}

let startingQuestion=false;
setInterval(async ()=>{
 if(!roomData)return;

  const remaining=Math.max(0,Math.ceil(((roomData.countdownUntil||0)-Date.now()-serverOffset)/1000));
  if($('startCountdown'))$('startCountdown').textContent=remaining||'GO!';
  if(remaining===0&&isHost&&!startingQuestion){
   startingQuestion=true;
   try{
    const snap=await db.ref('rooms/'+room).once('value'),d=snap.val();
    if(d?.status==='countdown'&&Date.now()+serverOffset>=d.countdownUntil)await publishQuestion(0,1,d.settings);
   }catch(e){error(e)}finally{startingQuestion=false}
  }
  return;
 }
 if(roomData.status!=='question')return;
 const t=roomData.deadline?Math.max(0,Math.ceil((roomData.deadline-Date.now()-serverOffset)/1000)):null;
 if($('timeLeft'))$('timeLeft').textContent=t===null?'∞':t+'秒';

},250);
