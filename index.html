function home(){skipAnimation();$('reactbar').classList.add('hidden');room='';roomData=null;$('roomBadge').textContent='未参加';let join=(new URLSearchParams(location.search).get('room')||'').toUpperCase().slice(0,6);$('app').innerHTML=`<section class="panel"><h2>🏟️ オンライン協力クイズ</h2><p class="notice">全員が回答すると自動で判定します。以前の青×金のデザインを引き継いだオンラインテスト版です。問題はテスト用の5問です。</p><div class="grid"><label>ニックネーム<input id="name" maxlength="12" value="${esc(profile.name)}" placeholder="例：円堂"></label><label>アイコン<select id="icon">${icons.map(i=>`<option ${i===profile.icon?'selected':''}>${i}</option>`).join('')}</select></label></div><p><button class="gold" onclick="createRoom()">⚡ 部屋を作る（ホスト）</button></p><div class="divider"></div><h3>友達の部屋に参加</h3><label>部屋番号<input id="joinCode" maxlength="6" value="${esc(join)}" placeholder="6文字"></label><p><button onclick="joinRoom()">部屋に参加する</button></p></section>`}

async function createRoom(){if(busy||!uid||!readProfile())return;busy=true;try{let id,ref,ok=false;for(let n=0;n<8;n++){id=code();ref=db.ref('rooms/'+id);let r=await ref.transaction(v=>v===null?{hostUid:uid,createdAt:firebase.database.ServerValue.TIMESTAMP,status:'lobby',round:0,questionIndex:0,settings:{mode:'record',difficulty:'すべて',count:5,seconds:60},players:{[uid]:{name:profile.name,icon:profile.icon,joinedAt:firebase.database.ServerValue.TIMESTAMP}}}:undefined,undefined,false);if(r.committed){ok=true;break}}if(!ok)throw Error('部屋を作れませんでした');enter(id)}catch(e){error(e)}finally{busy=false}}
async function joinRoom(){if(busy||!uid||!readProfile())return;const id=$('joinCode').value.trim().toUpperCase();if(!/^[A-Z2-9]{6}$/.test(id))return toast('6文字の部屋番号を入力してね');busy=true;try{const ref=db.ref('rooms/'+id),snap=await ref.once('value');if(!snap.exists())throw Error('部屋が見つかりません');if(snap.child('status').val()!=='lobby')throw Error('ゲーム進行中です。ロビーで参加してね');if(!snap.child('players/'+uid).exists()&&snap.child('players').numChildren()>=50)throw Error('満員です');await ref.child('players/'+uid).set({name:profile.name,icon:profile.icon,joinedAt:firebase.database.ServerValue.TIMESTAMP});enter(id)}catch(e){error(e)}finally{busy=false}}
function enter(id){if(roomListener&&room)db.ref('rooms/'+room).off('value',roomListener);room=id;lastResultKey='';attachReactions(id);history.replaceState(null,'',location.pathname+'?room='+encodeURIComponent(room));$('roomBadge').textContent='ROOM '+room;const ref=db.ref('rooms/'+room);roomListener=s=>{if(!s.exists()){toast('部屋が終了しました');leaveLocal();return}roomData=s.val();isHost=roomData.hostUid===uid;const resultKey=room+'-'+String(roomData.round||0);if(roomData.status==='result'&&lastResultKey!==resultKey){lastResultKey=resultKey;showAnimation(!!roomData.result?.success)}if(activeRound!==String(roomData.round||0)){activeRound=String(roomData.round||0);localAnswer=''}render();scheduleAutoClose()};ref.on('value',roomListener,error)}
function render(){if(!roomData)return;const d=roomData,players=Object.entries(d.players||{}),phase=d.status,me=d.answers?.[uid],q=d.currentQuestion,ansCount=Object.keys(d.answers||{}).length;$('reactbar').classList.toggle('hidden',!(phase==='result'||(phase==='question'&&!!me)||phase==='end'));let html=`<section class="panel"><div class="row spread"><h2>🏟️ ルーム ${esc(room)}</h2><span class="pill">${isHost?'👑 ホスト':'⚽ 参加者'}・${players.length}/50人</span></div><div class="row"><button onclick="copyLink()">📋 参加URLをコピー</button><button onclick="copyCode()">部屋番号をコピー</button></div></section>`;

if(phase==='question'&&q){const timeLeft=d.deadline?Math.max(0,Math.ceil((d.deadline-(Date.now()+serverOffset))/1000)):null;html+=`<section class="panel"><div class="row spread"><span class="pill">第${(d.questionIndex||0)+1}問 / ${d.total||'?'}問</span><span class="pill">${esc(q.difficulty)}・成功ライン ${q.threshold}%</span><span id="timeLeft" class="timer">${timeLeft===null?'∞':timeLeft+'秒'}</span></div><h2 class="center" style="margin:35px 0">${esc(q.question)}</h2>${me?`<p class="notice">✅ 回答を送信しました。ホストの判定を待ってね。</p>`:q.type==='choice'?`<div class="choices">${(q.choices||[]).map((x,i)=>`<button class="answer ${localAnswer===x?'selected':''}" onclick="selectChoice(${i})">${"ABCD"[i]}. ${esc(x)}</button>`).join('')}</div>`:`<label>答えを入力<input id="freeAnswer" maxlength="100" placeholder="答えを入力" value="${esc(localAnswer)}" oninput="localAnswer=this.value"></label>`}${!me?`<p><button class="gold" onclick="submitAnswer()">⚡ 回答を確定</button></p>`:''}<div class="divider"></div><p class="muted">回答済み ${ansCount} / ${players.length}人　${ansCount>=players.length?"⚡ 全員回答！結果を集計しています…":"全員回答すると自動で結果を表示します"}</p>${isHost?`<button onclick="finishRound()">回答を締め切って判定</button>`:''}</section>`}

// ホストが全員の回答を受信したら、自動で判定画面に切り替える。

function scheduleAutoClose(){
  clearTimeout(autoCloseTimer);autoCloseTimer=null;
  const d=roomData;
  if(!isHost||!d||d.status!=='question'||processing)return;
  const ids=Object.keys(d.players||{});
  if(!ids.length||!ids.every(id=>Object.prototype.hasOwnProperty.call(d.answers||{},id)))return;
  const expectedRoom=room,expectedRound=d.round;
  autoCloseTimer=setTimeout(()=>{
    const now=roomData;
    if(room!==expectedRoom||!isHost||processing||!now||now.status!=='question'||now.round!==expectedRound)return;
    const currentIds=Object.keys(now.players||{});
    if(currentIds.length&&currentIds.every(id=>Object.prototype.hasOwnProperty.call(now.answers||{},id)))finishRound();
  },650);
}

function cancelAnswerConfirm(){pendingAnswer=null;$('answerDialog').classList.add('hidden')}
async function submitAnswerConfirmed(){if(pendingAnswer===null)return;const answer=pendingAnswer;cancelAnswerConfirm();const d=roomData;if(!d||d.status!=='question'||d.answers?.[uid])return toast('回答受付は終了しています');if(d.deadline&&Date.now()+serverOffset>d.deadline)return toast('制限時間を過ぎています');try{const result=await db.ref('rooms/'+room+'/answers/'+uid).transaction(v=>v===null?{answer,submittedAt:firebase.database.ServerValue.TIMESTAMP}:undefined,undefined,false);if(!result.committed)toast('すでに回答済みです')}catch(e){error(e)}}
function settings(){return{mode:$('mode').value,difficulty:$('difficulty').value,count:$('count').value==='all'?'all':Number($('count').value),seconds:Number($('seconds').value)}}
function poolFor(s){const p=SAMPLE.filter(q=>s.difficulty==='すべて'||q.difficulty===s.difficulty);return p.sort((a,b)=>a.id.localeCompare(b.id))}
async function startGame(){if(!isHost||busy)return;const s=settings(),p=poolFor(s);if(!p.length)return toast('その難易度にはまだ問題がありません');busy=true;try{const total=s.count==='all'?p.length:Math.min(s.count,p.length);await db.ref('rooms/'+room).update({settings:s,total,questionIndex:0,round:0,wins:0,attempts:0});await publishQuestion(0,1,s)}catch(e){error(e)}finally{busy=false}}
async function publishQuestion(index,round,s){const p=poolFor(s),q=p[index%p.length],ref=db.ref('rooms/'+room);await ref.update({status:'lobby',answers:null,result:null,deadline:null});await ref.update({currentQuestion:{id:q.id,type:q.type,difficulty:q.difficulty,question:q.question,choices:q.choices||[],threshold:q.threshold||60},questionIndex:index,round,status:'question',deadline:s.seconds?Date.now()+serverOffset+s.seconds*1000:null})}
async function finishRound(){if(!isHost||processing||roomData?.status!=='question')return;processing=true;try{const d=(await db.ref('rooms/'+room).once('value')).val();if(d.status!=='question')return;const q=SAMPLE.find(x=>x.id===d.currentQuestion.id);if(!q)throw Error('問題データが見つかりません');const players=Object.keys(d.players||{}),correct=players.filter(id=>(q.answers||[]).some(a=>normalize(a)===normalize(d.answers?.[id]?.answer))).length,required=Math.ceil(players.length*(q.threshold||60)/100),success=correct>=required;await db.ref('rooms/'+room).update({status:'result',deadline:null,result:{correct,total:players.length,required,success,correctAnswers:q.answers.join(' / ')},wins:(d.wins||0)+(success?1:0),attempts:(d.attempts||0)+1})}catch(e){error(e)}finally{processing=false}}
async function nextQuestion(){if(!isHost||processing||roomData?.status!=='result')return;processing=true;try{const d=roomData;if(d.questionIndex+1>=d.total){await endGame()}else{await publishQuestion(d.questionIndex+1,(d.round||0)+1,d.settings)}}catch(e){error(e)}finally{processing=false}}
async function retryRound(){if(!isHost||processing||roomData?.status!=='result')return;processing=true;try{await publishQuestion(roomData.questionIndex,(roomData.round||0)+1,roomData.settings)}catch(e){error(e)}finally{processing=false}}
async function endGame(){if(!isHost)return;try{await db.ref('rooms/'+room).update({status:'end',answers:null,deadline:null})}catch(e){error(e)}}
async function backLobby(){if(!isHost)return;try{await db.ref('rooms/'+room).update({status:'lobby',answers:null,result:null,currentQuestion:null,deadline:null})}catch(e){error(e)}}
async function copyLink(){const u=location.origin+location.pathname+'?room='+encodeURIComponent(room);try{await navigator.clipboard.writeText(u);toast('参加URLをコピーしました')}catch(e){prompt('URLをコピー',u)}}
async function copyCode(){try{await navigator.clipboard.writeText(room);toast('部屋番号をコピーしました')}catch(e){prompt('部屋番号をコピー',room)}}
function leaveLocal(){detachReactions();clearTimeout(autoCloseTimer);autoCloseTimer=null;if(room&&roomListener)db.ref('rooms/'+room).off('value',roomListener);roomListener=null;history.replaceState(null,'',location.pathname);home()}
async function leaveRoom(){if(!room)return;try{if(isHost)return toast('ホストは「部屋を終了」を使ってね');await db.ref('rooms/'+room+'/players/'+uid).remove();leaveLocal()}catch(e){error(e)}}
async function closeRoom(){if(!isHost||!confirm('部屋を終了しますか？'))return;try{await db.ref('rooms/'+room).remove();leaveLocal()}catch(e){error(e)}}

function toggleMute(){muted=!muted;$('muteBtn').textContent=muted?'🔇 音 OFF':'🔊 音 ON'}

let audioCtx=null;
function tone(f,when,duration,shape='sine',volume=.07,endFreq=null){
 if(muted)return;
 try{
  audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+when;
  o.type=shape;o.frequency.setValueAtTime(f,t);
  if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,t+duration);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+duration);
  o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.02);
 }catch(e){}
}
function playSound(kind){
 if(kind==='reaction'){tone(950,0,.075,'sine',.055,1250);tone(1500,.07,.105,'sine',.045,1750)}
 if(kind==='correct'){tone(523.25,0,.16,'triangle',.075);tone(659.25,.13,.17,'triangle',.08);tone(783.99,.27,.18,'triangle',.085);tone(1046.5,.43,.36,'sine',.09);tone(1567.98,.48,.26,'sine',.025)}
 if(kind==='wrong'){tone(392,0,.24,'triangle',.065,330);tone(311,.21,.28,'triangle',.07,245);tone(196,.48,.44,'sine',.075,130)}
}
function showAnimation(success){
 $('overlay').style.display='flex';$('overlayText').textContent=success?'TEAM CLEAR!':'TEAM FAILED';
 $('overlaySub').textContent=success?'必殺技発動！ チームの力で突破！':'必殺技不発！ まだ終わらない！';
 $('overlayText').style.color=success?'#ffdf62':'#d7bdff';
 playSound(success?'correct':'wrong');clearTimeout(animationTimer);animationTimer=setTimeout(skipAnimation,4000);
}
function skipAnimation(){$('overlay').style.display='none';clearTimeout(animationTimer)}
let reactionListener=null,reactionRoom='',reactionSeen=new Set();
function detachReactions(){
 if(reactionListener&&reactionRoom)db.ref('rooms/'+reactionRoom+'/reactions').off('child_added',reactionListener);
 reactionListener=null;reactionRoom='';reactionSeen.clear();
}
function attachReactions(id){
 detachReactions();reactionRoom=id;
 const ref=db.ref('rooms/'+id+'/reactions');
 // Ignore reactions already stored before this client joined.
 ref.once('value').then(snapshot=>{
  if(room!==id)return;
  snapshot.forEach(child=>reactionSeen.add(child.key));
  reactionListener=snap=>{
   if(reactionSeen.has(snap.key)||room!==id)return;
   reactionSeen.add(snap.key);
   const r=snap.val();
   if(!r||!['⚡','🔥','👏','😱','💪'].includes(r.emoji))return;
   showReaction(r.emoji,r.name||'ゲスト',true);
  };
  ref.on('child_added',reactionListener,error);
 }).catch(error);
}
function showReaction(emoji,name,withSound){
 const layer=$('floats');if(layer.children.length>=5)layer.firstElementChild.remove();
 const el=document.createElement('div');el.className='float';
 el.style.setProperty('--x',(15+Math.floor(Math.random()*65))+'%');
 el.innerHTML=esc(emoji)+'<small>'+esc(name)+'</small>';
 layer.appendChild(el);setTimeout(()=>el.remove(),3000);
 if(withSound)playSound('reaction');
}
async function reaction(emoji){
 if(!room||!roomData)return;
 if(Date.now()-reactionAt<3000)return toast('リアクションは3秒に1回まで');
 reactionAt=Date.now();
 // Show instantly on sender's device; ignore own Firebase echo.
 showReaction(emoji,profile.name,true);
 try{
  const ref=db.ref('rooms/'+room+'/reactions').push();
  reactionSeen.add(ref.key);
  await ref.set({emoji,name:profile.name,uid,at:firebase.database.ServerValue.TIMESTAMP});
 }catch(e){error(e)}
}

setInterval(()=>{if(!roomData||roomData.status!=='question')return;const t=roomData.deadline?Math.max(0,Math.ceil((roomData.deadline-Date.now()-serverOffset)/1000)):null;if($('timeLeft'))$('timeLeft').textContent=t===null?'∞':t+'秒';if(t===0&&isHost&&!processing)finishRound()},500);
auth.onAuthStateChanged(async u=>{if(!u){try{await auth.signInAnonymously()}catch(e){$('status').textContent='接続失敗';error(e)}return}uid=u.uid;$('status').textContent='🟢 接続済み';home()},e=>{$('status').textContent='接続失敗';error(e)});
</script></body></html>
