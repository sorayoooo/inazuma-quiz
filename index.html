<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>イナイレ協力クイズ | オンライン接続テスト</title><style>
:root{font-family:system-ui,'Yu Gothic',sans-serif;color:#f5f8ff;background:#08172f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% 0,#184a83 0,transparent 50%),linear-gradient(145deg,#071328,#112e58)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:#254e83;color:white;font-weight:800}button:hover:not(:disabled){filter:brightness(1.15)}button:disabled{opacity:.45;cursor:not-allowed}.gold{background:linear-gradient(135deg,#ffdf62,#e9a91b);color:#172743}.danger{background:#9d3551}.ghost{background:#203f6a}.wrap{max-width:1000px;margin:auto;padding:24px 16px 110px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:clamp(24px,5vw,38px);margin:0;color:#ffdc65;text-shadow:0 0 20px #ffcb4855}h2{margin:0 0 14px;font-size:23px}h3{margin:8px 0}.sub{color:#bbd4ef;font-size:13px}.panel{background:#102b50d9;border:1px solid #37659c;border-radius:20px;padding:20px;margin-top:18px;box-shadow:0 12px 35px #0003}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.stack{display:grid;gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}label{display:grid;gap:5px;font-size:13px;color:#c9def6}input,select,textarea{width:100%;background:#081e3b;color:#fff;border:1px solid #4572a5;border-radius:10px;padding:11px}textarea{min-height:80px;resize:vertical}input[type=checkbox]{width:auto}.muted{color:#aac9e7}.pill{display:inline-block;background:#224b7b;border:1px solid #4974a7;border-radius:100px;padding:5px 11px;font-size:12px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.answer{min-height:70px;text-align:left;font-size:17px;border:2px solid #4675aa;background:linear-gradient(140deg,#1c477d,#15335c)}.answer.selected{border-color:#ffda58;background:#7d5d1e;box-shadow:0 0 20px #ffd14c77}.answer.correct{border-color:#73ebae}.answer.wrong{border-color:#e47b91}.timer{font-size:27px;font-weight:900;color:#ffdf62}.progress{height:12px;border-radius:99px;background:#071a33;overflow:hidden}.progress>div{height:100%;background:#ffcb3b;transition:width .2s}.big{font-size:clamp(28px,6vw,56px);font-weight:1000;color:#ffdd5b;text-align:center}.center{text-align:center}.hidden{display:none!important}.reactbar{position:fixed;bottom:0;left:0;right:0;background:#081a33ed;border-top:1px solid #4a77a4;padding:10px;z-index:20;display:flex;justify-content:center;gap:8px}.reactbar button{font-size:24px;padding:7px 13px}.float-layer{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}.float{position:absolute;bottom:85px;left:var(--x);display:grid;text-align:center;font-size:31px;animation:fly 3s ease-out forwards;text-shadow:0 2px 6px #000}.float small{font-size:11px;color:#fff}@keyframes fly{to{transform:translateY(-200px);opacity:0}}.flash{animation:flash .5s 3}@keyframes flash{50%{filter:brightness(2)}}.countdown{font-size:50px;color:#ffdf62;font-weight:1000}.notice{border-left:4px solid #ffda5d;padding:9px 12px;background:#1b3c66;border-radius:5px}.tiny{font-size:12px}.questions-list{max-height:270px;overflow:auto}.qrow{border-bottom:1px solid #375a83;padding:10px 0}.badge{color:#ffdf62;font-weight:800}#toast{position:fixed;top:15px;right:15px;background:#f5c84a;color:#14233d;padding:13px 20px;border-radius:12px;font-weight:800;z-index:60;max-width:90vw;display:none}#overlay{position:fixed;inset:0;background:#061126ed;display:none;z-index:40;align-items:center;justify-content:center;padding:20px}#overlay>div{max-width:600px;width:100%;border:2px solid #e5b63d;background:radial-gradient(circle,#295894,#10264a);padding:30px;border-radius:25px;text-align:center;box-shadow:0 0 100px #ffcc3970}.lightning{font-size:80px;animation:pulse .7s infinite alternate}@keyframes pulse{to{transform:scale(1.25);filter:drop-shadow(0 0 25px gold)}}@media(max-width:620px){.grid,.choices{grid-template-columns:1fr}.panel{padding:15px}.wrap{padding-top:14px}.reactbar button{padding:8px}}
.confirm-backdrop{position:fixed;inset:0;z-index:55;background:#051021e8;display:flex;align-items:center;justify-content:center;padding:18px}.confirm-panel{background:#15365f;border:2px solid #f4c94c;border-radius:20px;padding:24px;max-width:420px;width:100%;text-align:center;box-shadow:0 15px 50px #0009}.confirm-panel p{overflow-wrap:anywhere}.confirm-backdrop.hidden{display:none!important}.answer:focus-visible,button:focus-visible{outline:3px solid #ffda58;outline-offset:3px}
#status{font-size:13px;color:#c6ddf6}#app{min-height:300px}.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.player{background:#1a416f;padding:13px;border-radius:12px}.copy{overflow-wrap:anywhere;color:#ffdd65}.notice{line-height:1.65}</style></head><body><div id="toast"></div><main class="wrap"><header><div><h1>⚡ イナイレ協力クイズ</h1><div class="sub">オンライン接続テスト版 v0.1</div></div><div class="row"><span id="status">Firebase接続中…</span><span id="roomBadge" class="pill">未参加</span></div></header><div id="app"></div></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script>
'use strict';
const firebaseConfig={apiKey:"AIzaSyDi8Fq5aBBGTxqnfXeJ0C47iZagOXVNteY",authDomain:"inazuma-quiz.firebaseapp.com",databaseURL:"https://inazuma-quiz-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"inazuma-quiz",storageBucket:"inazuma-quiz.firebasestorage.app",messagingSenderId:"1015045226414",appId:"1:1015045226414:web:b9ca7af847e5d7d908d23f",measurementId:"G-SCMVW4HBWD"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.database();
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let uid='',room='',isHost=false,profile={name:'',icon:'⚽'},roomData=null,roomListener=null,busy=false;
const icons=['⚽','⚡','🔥','🧤','🌪️','❄️','🥽','🌰','🗼','🧱'];
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',4000)}
function error(e){console.error(e);toast('エラー：'+(e?.message||e));}
function code(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';const b=new Uint32Array(6);crypto.getRandomValues(b);for(let i=0;i<6;i++)s+=a[b[i]%a.length];return s}
function renderHome(){room='';roomData=null;$('roomBadge').textContent='未参加';let params=new URLSearchParams(location.search),join=(params.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);$('app').innerHTML=`<section class="panel"><h2>🏟️ オンラインで集まろう！</h2><p class="notice">この版では、部屋の作成・参加・参加者のリアルタイム表示をテストできます。クイズ本編は次の段階で追加します。</p><div class="grid"><label>ニックネーム（12文字以内）<input id="name" maxlength="12" placeholder="例：円堂" value="${esc(profile.name)}"></label><label>アイコン<select id="icon">${icons.map(i=>`<option value="${i}" ${i===profile.icon?'selected':''}>${i}</option>`).join('')}</select></label></div><p><button class="gold" id="create" onclick="createRoom()">⚡ 部屋を作る（ホスト）</button></p><div class="divider"></div><h3>友達の部屋に参加</h3><label>6文字の部屋番号<input id="joinCode" maxlength="6" autocomplete="off" placeholder="例：AB12CD" value="${esc(join)}"></label><p><button onclick="joinRoom()">部屋に参加する</button></p></section>`;}
function readProfile(){const name=$('name')?.value.trim();if(!name||name.length>12){toast('ニックネームを1〜12文字で入力してね');return false}profile={name,icon:$('icon').value};return true}
async function createRoom(){if(busy||!uid||!readProfile())return;busy=true;try{let id,ref;for(let n=0;n<8;n++){id=code();ref=db.ref('rooms/'+id);const result=await ref.transaction(v=>v===null?{hostUid:uid,createdAt:firebase.database.ServerValue.TIMESTAMP,status:'lobby',players:{[uid]:{name:profile.name,icon:profile.icon,joinedAt:firebase.database.ServerValue.TIMESTAMP}}}:undefined,undefined,false);if(result.committed)break;ref=null}if(!ref)throw Error('部屋を作れませんでした。再度お試しください');enter(id,true)}catch(e){error(e)}finally{busy=false}}
async function joinRoom(){if(busy||!uid||!readProfile())return;const id=$('joinCode').value.trim().toUpperCase();if(!/^[A-Z2-9]{6}$/.test(id))return toast('6文字の部屋番号を入力してね');busy=true;try{const ref=db.ref('rooms/'+id),snap=await ref.once('value');if(!snap.exists())throw Error('その部屋は見つかりません');if(snap.child('status').val()!=='lobby')throw Error('現在は参加受付を終了しています');if(!snap.child('players/'+uid).exists()&&snap.child('players').numChildren()>=50)throw Error('満員です（最大50人）');await ref.child('players/'+uid).set({name:profile.name,icon:profile.icon,joinedAt:firebase.database.ServerValue.TIMESTAMP});enter(id,snap.child('hostUid').val()===uid)}catch(e){error(e)}finally{busy=false}}
function enter(id,host){if(roomListener){db.ref('rooms/'+room).off('value',roomListener)}room=id;isHost=host;history.replaceState(null,'',location.pathname+'?room='+encodeURIComponent(room));$('roomBadge').textContent='ROOM '+room;const ref=db.ref('rooms/'+room);roomListener=s=>{if(!s.exists()){toast('部屋が終了しました');leaveLocal();return}roomData=s.val();isHost=roomData.hostUid===uid;renderRoom()};ref.on('value',roomListener,error)}
function renderRoom(){const players=Object.entries(roomData?.players||{}),url=location.origin+location.pathname+'?room='+encodeURIComponent(room);$('app').innerHTML=`<section class="panel"><div class="row spread"><h2>🏟️ ルーム ${esc(room)}</h2><span class="pill">${isHost?'👑 ホスト':'⚽ 参加者'}</span></div><p class="notice">${isHost?'友達に参加URLか部屋番号を送ってね。':'ホストが準備しています。ほかの人の参加状況が自動で更新されます。'}</p><p>参加URL：<span class="copy">${esc(url)}</span></p><div class="row"><button class="gold" onclick="copyLink()">📋 参加URLをコピー</button><button onclick="copyCode()">部屋番号をコピー</button></div></section><section class="panel"><div class="row spread"><h2>参加者一覧</h2><span class="pill">${players.length} / 50人</span></div><div class="players">${players.map(([id,p])=>`<div class="player">${esc(p.icon||'⚽')} ${esc(p.name||'ゲスト')} ${id===roomData.hostUid?'👑':''} ${id===uid?'（あなた）':''}</div>`).join('')}</div></section><section class="panel"><h3>接続テスト</h3><p class="muted">別のスマホで参加URLを開き、名前を入力して「部屋に参加する」を押すと、この一覧が自動更新されます。</p><div class="row">${isHost?'<button class="danger" onclick="closeRoom()">部屋を終了する</button>':''}<button onclick="leaveRoom()">部屋から退出</button></div></section>`}
async function copyLink(){const u=location.href;try{await navigator.clipboard.writeText(u);toast('参加URLをコピーしたよ！')}catch(e){prompt('このURLをコピーしてね',u)}}
async function copyCode(){try{await navigator.clipboard.writeText(room);toast('部屋番号をコピーしたよ！')}catch(e){prompt('この番号をコピーしてね',room)}}
function leaveLocal(){if(room&&roomListener)db.ref('rooms/'+room).off('value',roomListener);roomListener=null;history.replaceState(null,'',location.pathname);renderHome()}
async function leaveRoom(){if(!room)return;try{if(isHost){toast('ホストは「部屋を終了する」を押してね');return}await db.ref('rooms/'+room+'/players/'+uid).remove();leaveLocal()}catch(e){error(e)}}
async function closeRoom(){if(!isHost||!room)return;if(!confirm('この部屋を終了しますか？'))return;try{await db.ref('rooms/'+room).remove();leaveLocal()}catch(e){error(e)}}
auth.onAuthStateChanged(async u=>{if(!u){try{await auth.signInAnonymously()}catch(e){$('status').textContent='接続失敗';error(e)}return}uid=u.uid;$('status').textContent='🟢 接続済み';renderHome()},e=>{$('status').textContent='接続失敗';error(e)});
</script></body></html>
